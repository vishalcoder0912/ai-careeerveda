<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="https://ik.imagekit.io/q7ucn1rfni/careerveda/brand/cvfavicon-039eb18e.jpg?tr=w-64&updatedAt=1783702268532"
    />
    <link
      rel="apple-touch-icon"
      href="https://ik.imagekit.io/q7ucn1rfni/careerveda/brand/cvfavicon-039eb18e.jpg?tr=w-180&updatedAt=1783702268532"
    />
    <!-- These are the crawler-visible defaults. seoTags.js rewrites them per
         route once React boots, which Google honours because it executes JS       
         but Facebook, LinkedIn, WhatsApp and X read this raw HTML and never run
         a line of it. So whatever is written here is what every shared link
         shows, for every URL on the site. It describes the organisation rather
         than "the landing page", which is what it said before and which is not
         a sentence anyone searching for a course wants to read. -->
    <meta
      name="description"
      content="CareerVeda offers mentor-led PG programs in Product Management, Data Analytics, Data Science with AI, Investment Banking, Cybersecurity and Data Engineering        with placement assistance and industry projects."
    />
    <!-- Apex, not www        this must match SITE_URL in src/config/siteMeta.js, which
         nginx.conf 301s www to. prerender.mjs rewrites this per route, so the
         literal here only ships on a route the prerender missed; when that
         happens it should still name the host that answers rather than the one
         that redirects. -->
    <link rel="canonical" href="https://careerveda.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b1220" />

    <meta property="og:site_name" content="CareerVeda" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careerveda.in/" />
    <meta property="og:title" content="India's No 1 PG Program | CareerVeda" />
    <meta
      property="og:description"
      content="Mentor-led PG programs in Product Management, Data Analytics, Data Science with AI, Investment Banking, Cybersecurity and Data Engineering, with placement assistance."
    />
    <meta
      property="og:image"
      content="https://ik.imagekit.io/q7ucn1rfni/careerveda/brand/cvfavicon-039eb18e.jpg?tr=w-1200,h-630,cm-pad_resize,bg-0B1220"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- summary_large_image, not summary: the small card crops a 1200x630 image
         to a square thumbnail and throws most of it away. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareerVeda  AI-Powered Career Platform" />
    <meta
      name="twitter:description"
      content="Mentor-led PG programs with placement assistance in product, analytics, AI, finance and security."
    />
    <meta
      name="twitter:image"
      content="https://ik.imagekit.io/q7ucn1rfni/careerveda/brand/cvfavicon-039eb18e.jpg?tr=w-1200,h-630,cm-pad_resize,bg-0B1220"
    />

    <!-- Every image on the site comes from ImageKit. Opening the connection here
         means the first card image is not also paying for DNS + TLS. -->
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />

    <!-- Inlined font-face declarations to eliminate render-blocking /fonts/fonts.css request -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-var-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-var-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-var-rupee.woff2) format('woff2');
        unicode-range: U+20B9;
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url(/fonts/manrope-var-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url(/fonts/manrope-var-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- Preload primary variable font files for fast render -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-var-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/manrope-var-latin.woff2"
      crossorigin
    />

    <!-- On phones the live Spline scene waits for the first gesture, so the 3D
         robot's still poster is the hero's LCP element. Preloading it (phones
         only, via media) lets it start fetching with the page instead of after
         React mounts, and the desktop that skips the poster never pays for it. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-robot.webp"
      media="(max-width: 900px)"
      fetchpriority="high"
    />

    <title>Online PG Programs with Placement Assistance | CareerVeda</title>

    <!-- Google Analytics 4. send_page_view is off because this is a single-page
         app: the tag loads once, but the visitor moves through a dozen routes
         without another document load. RouteMeta in App.jsx sends the page_view
         on every location change, first one included        so GA sees every route,
         and the landing page is not counted twice. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1P67KR40MJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-1P67KR40MJ", {send_page_view: false});
    </script>

    <!-- The app is client-rendered, so until React boots there is nothing in the
         document to show. Painting the page's own background on the root element
         means that stretch reads as the site loading rather than as a white flash,
         and because the colour matches what React renders, nothing changes when it
         mounts. No placeholder element: a splash that gets torn down is one more
         thing to see, and the visitor did not ask to look at it. -->
    <style>
      html {
        background: #0b1220
          radial-gradient(circle at 50% 30%, #16233d 0%, #0b1220 70%) no-repeat;
      }
      /* The static poster lives in #root so React wipes it on mount, and
         snapshot.mjs replaces it in the built HTML — so it never coexists
         with the app. Centred on the page background so it reads as the
         hero loading rather than as a broken layout. */
      .static-hero-poster {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(56vw, 420px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- The hero robot is the LCP element on phones, and it only exists after
           React boots. This paints it on the very first paint — the preload
           above has it in flight before the HTML even parses — so the slowest
           visitor sees the hero instead of an empty background while the app
           starts. createRoot wipes #root on mount. -->
      
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
