            return stored[key] === "granted" || stored[key] === "denied";
          });
        gtag("consent", "default", Object.assign({wait_for_update: 500}, DENIED));
        if (valid && stored.ad_storage === "granted") gtag("consent", "update", GRANTED);

    <!-- GA4. The published GTM-KMLHFSW4 container currently has no tags in it,
         so gtag.js must be loaded here: removing this loader silently stopped all
         analytics. Do NOT add a GA4/Google tag inside the container while this
         loader exists — that is the one way to double-count hits. The guard in
         boot() skips this loader if a GTM-managed gtag.js is already present.
         send_page_view is off because seoTags.js reports every SPA route.
         Boot on DOMContentLoaded, not on the first interaction: waiting for a
         click or a 30-second timer dropped every visitor who bounced without
         touching the page. The script is async, so it still does not block paint. -->
    <script>
      gtag("config", "G-1P67KR40MJ", {send_page_view: false});

      (function () {
        var booted = false;
        function hasGtag() {
          return !!document.querySelector('script[src*="gtag/js?id=G-"]');
        }
        function boot() {
          if (booted || hasGtag()) return;
          booted = true;
          var script = document.createElement("script");
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-1P67KR40MJ";
          script.async = true;
          document.head.appendChild(script);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot, {once: true});
        } else {
          boot();
        }
      })();
    </script>
