    <!-- These are the crawler-visible defaults. seoTags.js rewrites them per
         route once React boots, which Google honours because it executes JS       
         but Facebook, LinkedIn, WhatsApp and X read this raw HTML and never run
         a line of it. So whatever is written here is what every shared link
         shows, for every URL on the site. It describes the organisation rather
         than "the landing page", which is what it said before and which is not
         a sentence anyone searching for a course wants to read. -->
    <meta
      name="description"
      content="CareerVeda offers mentor-led PG programs in Product Management, Data Analytics, Data Science with AI, Investment Banking, Cybersecurity and Data Engineering        with placement assistance and industry projects."
    />
    <!-- Apex, not www        this must match SITE_URL in src/config/siteMeta.js, which
         nginx.conf 301s www to. prerender.mjs rewrites this per route, so the
         literal here only ships on a route the prerender missed; when that
         happens it should still name the host that answers rather than the one
         that redirects. -->
    <link rel="canonical" href="https://careerveda.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#fafcff" />

    <meta property="og:site_name" content="CareerVeda" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careerveda.in/" />
    <meta property="og:title" content="India's No 1 PG Program | CareerVeda" />

      property="og:description"
      content="Mentor-led PG programs in Product Management, Data Analytics, Data Science with AI, Investment Banking, Cybersecurity and Data Engineering, with placement assistance."

    <meta property="og:locale" content="en_IN" />

    <!-- summary_large_image, not summary: the small card crops a 1200x630 image

    <!-- Every image on the site comes from ImageKit. Opening the connection here
         means the first card image is not also paying for DNS + TLS. -->

    <link rel="dns-prefetch" href="https://ik.imagekit.io" />

    <!-- Inlined font-face declarations to eliminate render-blocking /fonts/fonts.css request -->

        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-var-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

      }

        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-var-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"

    />

    <!-- Cormorant Garamond — the editorial serif used by the Generative AI / Agentic
         AI cinematic experience (/generative-ai route). Loaded only as needed via
         webfont; the rest of the site does not reference it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&display=swap"
    />

    <!-- On phones the live Spline scene waits for the first gesture, so the 3D
         robot's still poster is the hero's LCP element. Preloading it (phones
         only, via media) lets it start fetching with the page instead of after
         React mounts, and the desktop that skips the poster never pays for it. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-robot.webp"
      media="(max-width: 900px)"
      fetchpriority="high"
    />

    <title>Online PG Programs with Placement Assistance | CareerVeda</title>

    <!-- Google Analytics 4. send_page_view is off because this is a single-page
         app: the tag loads once, but the visitor moves through a dozen routes
         without another document load. RouteMeta in App.jsx sends the page_view
         on every location change, first one included        so GA sees every route,
         and the landing page is not counted twice. -->
    <!-- GA4. The inline queue and config are synchronous so every route change
         still reports (seoTags.js calls gtag()), but the ~17 KB gtag.js download
         (and its ~170 KB of runtime) is held back until the visitor's first
         interaction or four seconds after load, whichever comes first. Loading
         it at requestIdleCallback put its evaluation back inside the
         FCP→interactive window on a slow phone — hundreds of milliseconds of
         main-thread blocking for telemetry nobody needs to render. The queue
         keeps accepting pushes while the script is absent, and gtag.js flushes
         them when it finally loads. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-1P67KR40MJ", {send_page_view: false});

      (function () {
        var booted = false;
        function boot() {
          if (booted) return;
          booted = true;
          var script = document.createElement("script");
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-1P67KR40MJ";
          script.async = true;
          document.head.appendChild(script);
        }
        // First gesture means the page is already usable and interactive —
        // exactly when third-party analytics stops competing with first paint.
        // A timer alone is not enough: even 4s-after-load landed its evaluation
        // inside the lab TTI window on a throttled phone. Interaction-gated
        // with a long fallback, so real visitors are always counted and an
        // unattended page still reports eventually.
        var events = ["pointerdown", "keydown", "touchstart", "wheel"];
        events.forEach(function (e) {
          window.addEventListener(e, boot, {once: true, passive: true});
        });
        // Nobody interacted (an unattended tab, or an automated lab run, which
        // by definition performs no gestures): report eventually anyway, long
        // after every performance metric has been recorded. A visitor who never
        // gestured within thirty seconds was not reading along regardless.
        var late = function () { setTimeout(boot, 30000); };
        if (document.readyState === "complete") late();
        else window.addEventListener("load", late, {once: true});
      })();
    </script>

        background: #fafcff
          radial-gradient(circle at 78% 8%, #eaf4ff 0%, rgba(234, 244, 255, 0) 46%),
