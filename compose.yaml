# Production-parity stack: the same three images Cloud Run runs, against a
# throwaway Mongo.
#
#   docker compose up --build     build once and run
#   docker compose watch          run, and keep the containers on your edits
#
# The `develop.watch` blocks below are what makes the second one work. Compose
# watches the paths listed and updates the running container itself, so a change
# to the frontend or to the backend does not need a remembered `--build` — the
# most common way a container ends up serving code that no longer exists.
#
# The project name is pinned rather than left to default. Without it Compose
# derives one from the directory, and every container, network and volume is
# keyed to that name — so a rename, a second checkout, or a copy of this repo
# under a differently-cased path silently becomes a SECOND stack with its own
# database, fighting the first one for ports 5173/5174/8081.
name: careerveda

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      # Published so the seed and migration scripts under backend/scripts can
      # reach this database from the host — they are not in the backend image,
      # which copies src/ only. 27018 rather than 27017 so it cannot collide
      # with a MongoDB already installed on the machine, and so no tool that
      # defaults to 27017 finds this throwaway data by accident.
      #
      #   MONGODB_URI=mongodb://127.0.0.1:27018 npm --prefix backend run seed:admin
      #
      # Local only. Nothing in the deployed stack publishes a database port.
      - "27018:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 8080
      # Keep the local Docker stack self-contained. The configured Atlas
      # cluster remains untouched and is not reachable from this machine.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: careerveda
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Host port 8080 is in use by an existing container on this machine.
      - "8081:8080"
    develop:
      watch:
        # The server is plain Node with no bundler, so the changed file is the
        # file it runs: copy it in and restart. Seconds, not a rebuild.
        - action: sync+restart
          path: ./backend/src
          target: /app/src
        # A dependency change is not something a file copy can satisfy —
        # node_modules is baked in a layer, so this one has to go through npm ci.
        - action: rebuild
          path: ./backend/package.json

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: http://localhost:8081/api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:8080"
    develop:
      watch:
        # Nothing to sync into: what nginx serves is a compiled bundle plus the
        # prerendered and snapshotted HTML, none of which exists until Vite and
        # the postbuild scripts have run. So the image is what has to change.
        # Slower than a dev server with HMR — run `npm run dev` for that loop;
        # this one is for checking the artefact you are about to deploy.
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./public
        - action: rebuild
          path: ./index.html
        - action: rebuild
          path: ./package.json
        # nginx.conf is baked into the runtime stage, so an edit to it is
        # invisible until the image is rebuilt — the same class of "container is
        # serving code that no longer exists" this whole block exists to prevent.
        # Shared with admin, which lists it too.
        - action: rebuild
          path: ./nginx.conf
        # The postbuild prerender/snapshot read these, so their output changes
        # when the scripts do.
        - action: rebuild
          path: ./scripts

  admin:
    build:
      # The admin package references the parent package via file:.., so its
      # build context must include both the admin and the project root.
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_ADMIN_API_BASE_URL: http://localhost:8081/api/v1
        VITE_PUBLIC_SITE_URL: http://localhost:5173
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:8080"
    develop:
      watch:
        - action: rebuild
          path: ./admin/src
        - action: rebuild
          path: ./admin/index.html
        - action: rebuild
          path: ./admin/package.json
        - action: rebuild
          path: ./nginx.conf

volumes:
  mongo_data:
