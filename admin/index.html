<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- An admin panel must never be indexed, and noindex in a meta tag only
         works if a crawler gets far enough to parse it. The Cloud Run service
         should also send X-Robots-Tag, but this costs nothing as a backstop. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>CareerVeda Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
