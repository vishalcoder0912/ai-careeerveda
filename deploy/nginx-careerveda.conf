# CareerVeda nginx config — hardened single-VM deployment.
#
# Served by this one nginx:
#   :80   → the public site (static build from /opt/careerveda/dist)
#           /api/* and /health are proxied to the Node API on 127.0.0.1:8080
#   :8081 → the admin panel (static build from /opt/careerveda/admin/dist)
#
# DDoS protection layers:
#   1. limit_conn  — caps concurrent connections per IP
#   2. limit_req   — caps request rate per IP (leaky bucket)
#   3. client_*    — rejects oversized bodies and slow loris attacks
#   4. map + block — drops known bad bots and scanners

# ── Global rate-limit zones ──────────────────────────────────────────────────
# $binary_remote_addr is 16 bytes (IPv4) or 28 bytes (IPv6) vs ~37 for the
# string form, so 10m of shared memory holds ~320k IPv4 entries.
limit_req_zone $binary_remote_addr zone=req_perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

# Separate, stricter zone for the API — it is the expensive path.
limit_req_zone $binary_remote_addr zone=api_perip:10m rate=5r/s;

# ── Bad bot / scanner block map ──────────────────────────────────────────────
# Match against User-Agent. If the UA is empty or matches a known scanner
# pattern, set $bad_bot to 1.
map $http_user_agent $bad_bot {
  default                                          0;
  ""                                               1;
  ~*(?:masscan|nikto|sqlmap|nmap|dirbuster|gobuster|ffuf|wfuzz|nuclei)  1;
  ~*(?:semrush|ahrefs|mj12bot|dotbot|petalbot|bytespider)              1;
  ~*(?:python-requests|go-http-client|curl|wget|libwww)                1;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  root /opt/careerveda/dist;
  index index.html;

  # ── Connection limits ───────────────────────────────────────────────────────
  # Max 20 concurrent connections per IP. A normal browser opens 6; a scraper
  # or DDoS tool opens hundreds.
  limit_conn conn_perip 20;

  # ── Request rate limit ──────────────────────────────────────────────────────
  # 10 req/s per IP with a burst of 20 (allow short spikes from legitimate
  # navigation). Requests beyond the burst are delayed, then rejected if the
  # delay queue fills.
  limit_req zone=req_perip burst=20 nodelay;
  limit_req_status 429;

  # ── Request body limits ─────────────────────────────────────────────────────
  # Rejects slow loris attacks and oversized payloads at the nginx layer.
  client_body_timeout    10s;
  client_header_timeout  10s;
  client_max_body_size   1m;
  send_timeout           10s;

  # Keep-alive: drop idle connections quickly under load.
  keepalive_timeout 15s;

  # ── Security headers ────────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ── Block bad bots / scanners ───────────────────────────────────────────────
  if ($bad_bot) {
    return 444;
  }

  # ── Block common attack paths ───────────────────────────────────────────────
  location ~* \.(env|git|svn|htaccess|htpasswd|bak|sql|log)$ {
    return 444;
  }

  location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin|\.well-known/security) {
    return 444;
  }

  # ── Gzip ────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Hashed Vite assets never change under a given name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API passthrough. `proxy_pass` without a URI keeps the full original path,
  # so /api/v1/auth/login reaches the backend as /api/v1/auth/login.
  location /api/ {
    # Stricter rate limit for API: 5 req/s with burst of 10.
    limit_req zone=api_perip burst=10 nodelay;
    limit_req_status 429;

    # Smaller connection limit for API.
    limit_conn conn_perip 10;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_connect_timeout 5s;

    # Buffer settings: prevents slow客户端 from tying up proxy connections.
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8080;
    access_log off;
    # Health checks bypass rate limiting — load balancers and monitoring need
    # these unrestricted.
    limit_req off;
    limit_conn off;
  }

  # SPA: every unknown path renders the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Admin panel on its own port so the built bundle needs no base-path surgery.
# Rate-limited separately to protect the CMS from brute-force admin login.
server {
  listen 8081 default_server;
  listen [::]:8081 default_server;
  server_name _;
  server_tokens off;

  root /opt/careerveda/admin/dist;
  index index.html;

  # Connection limit for admin.
  limit_conn conn_perip 10;

  # Rate limit admin panel.
  limit_req zone=req_perip burst=10 nodelay;
  limit_req_status 429;

  client_body_timeout    10s;
  client_header_timeout  10s;
  client_max_body_size   10m;
  send_timeout           10s;

  # Block bad bots on admin too.
  if ($bad_bot) {
    return 444;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
