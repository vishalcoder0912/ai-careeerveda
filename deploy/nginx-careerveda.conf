# CareerVeda on one Compute Engine VM, no containers.
#
#   :80    the public site   (/var/www/careerveda/site)
#          /api/* and /health are proxied to the Node API on 127.0.0.1:8080
#   :8081  the admin panel   (/var/www/careerveda/admin)
#
# deploy.sh publishes into /var/www only after a build succeeds, so nginx never
# serves a half-built tree. Caching and security headers follow the rules in the
# repo-root nginx.conf, which explains each one; the short version:
#   - security headers at server level, and no location adds headers of its own
#     (an add_header in a location silently drops every server-level one);
#     caching is set with `expires`, which is not an add_header
#   - HTML always revalidates, hashed assets cache for a year
#   - try_files tries $uri/index.html BEFORE $uri/, so a prerendered route like
#     /programs/gen-ai is a 200, not a 301 to a URL that differs from its canonical

# Real client IP behind Cloudflare. With the orange-cloud proxy on, every
# connection arrives from a Cloudflare edge, so without this $remote_addr — and
# with it every nginx limit, the API's rate limits, lockout counters and IP
# blocklist — would key on Cloudflare's address and lump all visitors together.
# CF-Connecting-IP is trusted ONLY when the connection really comes from a
# Cloudflare range, so a client hitting the origin directly cannot forge it.
# Harmless with the proxy off: no connection matches, $remote_addr is unchanged.
# Ranges from https://www.cloudflare.com/ips/ — refresh if Cloudflare adds one.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Rate limits apply to the API and the admin panel only. A first page load
# fetches ~40 static files in parallel; a per-IP limit on those throttles real
# visitors, while the static files themselves cost nginx nothing. The API also
# runs its own per-route limiters behind this.
limit_req_zone  $binary_remote_addr zone=api_perip:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=admin_perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  root /var/www/careerveda/site;
  index index.html;

  limit_conn conn_perip 40;

  client_body_timeout    10s;
  client_header_timeout  10s;
  client_max_body_size   1m;
  send_timeout           10s;
  keepalive_timeout      15s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~* \.(env|git|svn|htaccess|htpasswd|bak|sql|log)$ { return 444; }
  location ~* /(wp-admin|wp-login|xmlrpc\.php|phpmyadmin) { return 444; }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/json
             application/javascript application/xml image/svg+xml;

  # The API, same origin as the site, so the browser sends no CORS preflight.
  # proxy_pass without a URI keeps the full path (/api/v1/... arrives as-is).
  # X-Forwarded-For is what the API's TRUST_PROXY=1 reads the client IP from.
  # Overwritten with the one resolved address, never appended to: a client-sent
  # X-Forwarded-For must not reach the API, so TRUST_PROXY stays 1 whether or
  # not Cloudflare is in front (nginx has already unwrapped Cloudflare above).
  location /api/ {
    limit_req zone=api_perip burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 12m;   # media uploads from the admin panel
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
  }

  location = /health {
    access_log off;
    proxy_pass http://127.0.0.1:8080;
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}

# The admin panel on its own port, so its bundle needs no base-path changes.
# Before exposing it publicly, move it to its own hostname with TLS (see
# DEPLOYMENT.md) — on plain http the login form sends the password unencrypted.
server {
  listen 8081 default_server;
  listen [::]:8081 default_server;
  server_name _;
  server_tokens off;

  root /var/www/careerveda/admin;
  index index.html;

  limit_conn conn_perip 20;
  limit_req zone=admin_perip burst=40 nodelay;
  limit_req_status 429;

  client_body_timeout    10s;
  client_header_timeout  10s;
  client_max_body_size   1m;
  send_timeout           10s;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # The admin bundle is plain Vite output: no inline scripts, no third-party
  # scripts. script-src 'self' therefore costs nothing and means an injected
  # <script> or on* handler cannot run — and a script that cannot run cannot
  # read the CSRF token from localStorage and mint itself a session.
  # style 'unsafe-inline' is for React style={} attributes; images/API are https.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
