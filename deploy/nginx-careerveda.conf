# CareerVeda nginx config — single-VM testing deployment.
#
# Served by this one nginx:
#   :80   → the public site (static build from /opt/careerveda/dist)
#           /api/* and /health are proxied to the Node API on 127.0.0.1:8080
#   :8081 → the admin panel (static build from /opt/careerveda/admin/dist)
#
# The frontend ships with an empty VITE_PUBLIC_API_BASE_URL in production, so it
# calls its own origin — /api/v1/... lands here and is proxied. No absolute URLs,
# no CORS configuration to drift out of sync with the VM's IP.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  server_tokens off;

  root /opt/careerveda/dist;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Hashed Vite assets never change under a given name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API passthrough. `proxy_pass` without a URI keeps the full original path,
  # so /api/v1/auth/login reaches the backend as /api/v1/auth/login.
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8080;
    access_log off;
  }

  # SPA: every unknown path renders the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Admin panel on its own port so the built bundle needs no base-path surgery.
server {
  listen 8081 default_server;
  listen [::]:8081 default_server;
  server_name _;
  server_tokens off;

  root /opt/careerveda/admin/dist;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
