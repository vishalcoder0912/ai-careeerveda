# www -> apex, production only. Install alongside nginx-careerveda.conf at
# cutover, as /etc/nginx/sites-available/careerveda-www:
#
#   sed "s/__DOMAIN__/careerveda.in/g" deploy/nginx-www-redirect.conf \
#     | sudo tee /etc/nginx/sites-available/careerveda-www >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/careerveda-www /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.careerveda.in
#
# A file of its own because the preview hostnames have no www, and a server block
# for a name that does not resolve is a certbot failure at cutover time.
#
# It needs to be on the certificate, not just redirected: the redirect is only
# reached after a successful TLS handshake, so without a certificate for www the
# visitor sees a browser security warning rather than the site.
server {
  listen 80;
  listen [::]:80;
  server_name www.__DOMAIN__;
  server_tokens off;

  return 301 https://__DOMAIN__$request_uri;
}
