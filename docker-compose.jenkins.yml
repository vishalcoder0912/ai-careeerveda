services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-careerveda
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    restart: unless-stopped
    networks:
      - jenkins-network

  jenkins-agent:
    build:
      context: .
      dockerfile: Jenkinsfile.docker
    container_name: jenkins-agent-careerveda
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/home/jenkins/agent/workspace
    environment:
      - JENKINS_URL=http://jenkins:8080
    depends_on:
      - jenkins
    networks:
      - jenkins-network

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge