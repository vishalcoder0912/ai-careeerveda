# The release gate, on GitHub Actions. Work is pushed to `dev`; this workflow is
# the only thing that writes to `main`, and only after every check has passed.
# So `main` holds nothing that was not lint-clean, unit-tested, e2e-tested and
# buildable.
#
#   git push origin dev  ──►  GitHub Actions  ──►  origin/main   (green only)
#
# Any other branch (and every PR) runs the same checks and skips Publish/Smoke,
# so a feature branch is still verified.
#
# Stage-for-stage this replaces the old Jenkins pipeline:
#
#   Jenkins stage                  →  job / step here
#   Install                        →  "Install dependencies" in quality + e2e
#   Dependency audit               →  quality: Dependency audit
#   Lint                           →  quality: Lint
#   Unit & integration tests       →  quality: Unit & integration tests
#   Jest unit tests (front/admin)  →  quality: Jest unit tests
#   Free E2E ports                 →  not needed: runners are ephemeral, the
#                                      offset ports can never be occupied
#   E2E tests                      →  e2e: E2E tests (same watchdog wrapper)
#   Performance budgets            →  e2e: Performance budgets
#   Load test                      →  e2e: Load test
#   Build                          →  build job
#   Publish to main                →  publish job (dev only)
#   Live smoke                     →  smoke job (dev only, opt-in)
#
# Why this cannot touch the live site:
#   - backend tests overwrite MONGODB_URI with mongodb-memory-server
#     (backend/tests/setup.js), so no suite can reach Atlas.
#   - e2e boots its own stack against in-memory mongo with ImageKit disabled
#     (backend/scripts/e2e-server.js). Nothing here needs any secret.
#   - there is still no deploy stage. Publishing to `main` is a git push, not a
#     release; whatever deploys from `main` stays a separate, deliberate step.

name: CI/CD

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

# A newer commit to the same branch cancels the stale run. One run per ref at a
# time; publish is a single atomic push, so an interrupted promotion simply
# happens again on the next run.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright reads CI to refuse reusing whatever is already listening.
  CI: "true"

jobs:
  # Audit + lint + every unit/integration suite. No servers, no credentials,
  # just the registry and in-memory databases.
  quality:
    name: Audit · Lint · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Node 22, matching the Dockerfiles. Node 20 left its maintenance window
      # in April 2026 and no longer receives security patches.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      - name: Dependency audit
        # Run inside each package: `npm audit --prefix` has been broken across
        # npm versions ("loadVirtual requires existing shrinkwrap file"),
        # while the in-directory form works everywhere.
        run: |
          npm audit --audit-level=high
          (cd backend && npm audit --audit-level=high)
          (cd admin && npm audit --audit-level=high)

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        # Backend Jest runs inside test:all (backend `test` runs Jest first).
        run: npm run test:all

      - name: Jest unit tests (frontend & admin)
        # Covers the frontend and admin repos, which test:all does not.
        run: |
          npm run test:jest:frontend
          npm run test:jest:admin

  # Real-browser end-to-end suite, performance budgets and load test against
  # the throwaway full stack. Runs in parallel with quality.
  e2e:
    name: E2E · Performance · Load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      - name: Install Playwright browser
        # --with-deps installs the OS libraries; this is Linux, where it works.
        run: npx playwright install --with-deps chromium

      # scripts/run-e2e-ci.mjs is the watchdog: it force-kills the whole
      # process tree if the runner has not exited within its cap, then exits
      # non-zero so the job fails fast instead of burning the timeout. Same
      # selection as `npm run test:e2e`: @performance is owned by the next step
      # and @smoke needs a live site this job must never touch.
      - name: E2E tests
        run: node scripts/run-e2e-ci.mjs --grep-invert "@visual|@performance|@smoke"

      # Real-browser Core Web Vitals on the key pages (see
      # e2e/performance.spec.js). Own watchdog cap of 8 minutes.
      - name: Performance budgets
        run: node scripts/run-e2e-ci.mjs --cap=8 --grep @performance --project=chromium

      # Hammers the throwaway E2E API and asserts p95/error-rate budgets
      # (scripts/load-test.mjs). Boots its own server.
      - name: Load test
        run: npm run test:load

      # Failure artifacts only; a green run writes nothing in test-results/.
      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Reached only when both jobs above passed — a failure anywhere blocks the
  # build, which is the whole gate.
  build:
    name: Build
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      # postbuild (scripts/prerender.mjs + snapshot.mjs) renders pages with
      # chromium for real body snapshots; without it they degrade to head-only.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build frontend, admin and backend
        run: |
          npm run build
          npm run build:admin
          npm run build:backend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            admin/dist/
          if-no-files-found: error
          retention-days: 7

  # Only ever runs for a push to `dev` that passed everything above. Pushes the
  # exact commit that was tested to `main` — no merge commit, no force: if main
  # has moved on, the non-fast-forward push fails and gets looked at instead of
  # overwriting whatever someone else put there.
  #
  # The built-in GITHUB_TOKEN does the pushing, so there is no credential to
  # rotate — and a token-authenticated push triggers no further workflows, so
  # the promotion cannot loop.
  publish:
    name: Publish dev → main
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Promote tested dev commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/main

  # Smoke test of the published main: if the site is down, blank, or its API is
  # not answering, someone should be told now rather than when a visitor lands
  # on it. Opt-in: set repository variables under Settings → Secrets and
  # variables → Actions → Variables to enable it. Without SMOKE_BASE_URL the
  # job is skipped entirely (the spec itself also skips without it).
  smoke:
    name: Live smoke
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.SMOKE_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_ADMIN_URL: ${{ vars.SMOKE_ADMIN_URL }}
      SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke the live site
        run: npm run test:smoke
