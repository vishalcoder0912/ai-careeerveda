

[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2026-10-01
reason = """
React Router RSC-mode CSRF bypass — a server Action can execute before the 400
response is returned. Not reachable here: the public site and the admin panel
are both client-only Vite SPAs built on BrowserRouter/Routes. Neither uses
RouterProvider, data-mode loaders or actions, the unstable RSC APIs the advisory
names, or a server entry of any kind, so the vulnerable code path is not in
either bundle.

Not upgraded because the only patched release is 8.3.0, and v8 is two major
migrations rather than a version bump: it removes the react-router-dom package
entirely (31 files import from it) and requires Vite 7 with Node >=22.22.0,
while both apps are on Vite ^6.0.7. Scheduled for the next Vite major. Revisit
immediately if either app adopts RSC or framework mode.
"""
