# Shared by the frontend and admin images. Both build from the project root,
# so one file covers both. Port 8080 because the nginx worker drops to an
# unprivileged user and cannot bind 80.

# www -> apex, 301. The block below is marked default_server and that is
# load-bearing: nginx makes the FIRST server for a listen its default, so this
# one must stay ahead of nothing — `server_name _` is not a catch-all.
server {
  listen 8080;
  listen [::]:8080;
  server_name ~^www\.(?<apex_domain>.+)$;
  server_tokens off;

  return 301 https://$apex_domain$request_uri;
}

# default_server is explicit so this stays the fallback no matter what is
# defined above it — see the note in the www block. This is the site.
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  # text/javascript is the one that actually fires: nginx 1.21.1 changed the
  # default MIME type for .js from application/javascript to text/javascript, so
  # on this image (1.31) the application/* entry never matched and every script
  # was served uncompressed — 494 KB of JS on the home page's critical path that
  # should have been 160 KB. Both spellings are listed because either can arrive
  # from an upstream proxy or a future mime.types change; an unmatched type in
  # this list costs nothing.
  gzip_types text/plain text/css text/javascript application/json
             application/javascript application/xml image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cache-Control lives HERE, not in a `location = /index.html`. That exact-match
  # block only ever fired for the literal URL /index.html, which nothing requests:
  # `/` and every prerendered route are served by this location, and try_files
  # serving a file directly does not re-enter location matching. So every HTML
  # page went out with only ETag/Last-Modified and no Cache-Control, which puts
  # browsers on heuristic freshness — they kept serving the previous build's HTML
  # after a redeploy, with its <script src> pointing at a hash that no longer
  # exists. The asset location above has its own add_header and is unaffected.
  #
  # This covers robots.txt, sitemap.xml and llms.txt too. Wanted: they are small,
  # and a stale sitemap is worth less than a fresh one.
  #
  # $uri/index.html BEFORE $uri/, and that ordering is the whole point.
  #
  # scripts/prerender.mjs writes each route as <route>/index.html, so
  # /programs/gen-ai exists on disk as a directory. With `$uri/` reached first,
  # nginx matches the directory and answers with its standard
  # add-a-trailing-slash 301 — every prerendered route returned a redirect, to a
  # URL that differs from the canonical the page itself declares. Google was
  # being handed a 301 on the exact address the document names as its own.
  #
  # Naming the index file directly serves it in place, so /programs/gen-ai is a
  # 200 with the prerendered body. `$uri/` stays after it to keep serving "/"
  # and any future real directory; /index.html is the SPA fallback for routes
  # that were never prerendered.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}
