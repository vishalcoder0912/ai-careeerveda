# Dependency scanning. GitHub-native, so there is no third-party account and no
# token to rotate — Dependabot opens PRs against known CVEs and stale versions.
#
# Three npm entries because this repo has three independent lockfiles. A single
# root entry would silently leave backend/ and admin/ unscanned, which is where
# the server-side dependencies (mongoose, jsonwebtoken, multer) actually live.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than one per package: a fifteen-PR Monday
      # gets ignored wholesale, which is worse than no scanning at all.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # Every FROM in the three Dockerfiles is pinned tag@sha256:… , so this entry is
  # now the ONLY thing that patches a base image. A digest is immutable: --pull
  # cannot find anything newer, and an unmerged PR from here is a knowingly
  # unpatched OS in production rather than a version number drifting behind.
  # Base images accumulate OS-level CVEs faster than npm packages do, so these
  # are the PRs to merge first, not last.
  #
  # This covers the distroless runtime too. Dependabot cannot bump `nonroot` to a
  # newer *tag* — there is no version in the name — but it does raise the pinned
  # digest when that tag is rebuilt, which is the update that actually matters.
  - package-ecosystem: docker
    directories:
      - /
      - /admin
      - /backend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /.codex/skills/ui-styling/scripts
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /.codex/skills/ui-styling/scripts/tests
    schedule:
      interval: daily
