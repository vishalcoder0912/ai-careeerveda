# CareerVeda CI/CD — GitHub Actions
#
# This workflow replaces Jenkins entirely. It runs on every push and PR to `main`
# and `dev`. The `publish` job promotes a passing `dev` commit to `main`
# (non-force push), which is the only way `main` advances.
#
# Architecture:
#   security →  secret scan (gitleaks) of the checked-out tree
#   quality  →  audit, lint, unit/integration tests (Vitest + Jest)
#   e2e      →  Playwright E2E, accessibility, performance, load (parallel with quality)
#   build    →  production builds (needs: quality, e2e, security)
#   publish  →  dev → main promotion (dev only, needs: build)
#   deploy   →  optional SSH deploy of the promoted main commit (needs: publish)
#   smoke    →  live-site sanity check (opt-in, needs: publish)
#
# No secrets required for CI — all tests use mongodb-memory-server and
# ImageKit is disabled in E2E. Deployment is opt-in through CD_SSH_HOST:
# the VM's 2-minute timer is the fallback and also only ever sees commits that
# reached main through the `publish` job.

name: CI/CD

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

# Cancel stale runs for the same ref. Publish is an atomic push so an
# interrupted promotion simply retries on the next run.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright reads CI to refuse reusing whatever is already listening.
  CI: "true"
  # E2E ports (match playwright.config.js defaults)
  E2E_API_PORT: "8081"
  E2E_FRONTEND_PORT: "5273"
  E2E_ADMIN_PORT: "5274"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # QUALITY — Audit + Lint + Unit/Integration Tests
  # No servers, no credentials, just the registry and in-memory databases.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Audit · Lint · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Node 24 — default runner version after June 16, 2026
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      - name: Dependency audit (shipped dependencies)
        # Gate on what actually ships. The dev-only toolchain (Vite, Vitest,
        # concurrently, jsdom) currently carries advisories that do not affect
        # the deployed site or API; Dependabot tracks those separately. A high
        # or critical finding in a production dependency still fails the run.
        run: |
          npm audit --omit=dev --audit-level=high
          (cd backend && npm audit --omit=dev --audit-level=high)
          (cd admin && npm audit --omit=dev --audit-level=high)

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        # Backend test runs Jest (unit) + Vitest (integration) with
        # mongodb-memory-server. Frontend/admin run Vitest (jsdom).
        env:
          NODE_ENV: test
          APP_ENV: ci
          MONGODB_URI: mongodb://127.0.0.1:27017/careerveda_test
          MONGODB_DB_NAME: careerveda_test
          JWT_ACCESS_SECRET: ci-access-secret-not-for-any-real-use-0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-not-for-any-real-use-0123456789
          IMAGEKIT_PUBLIC_KEY: ""
          IMAGEKIT_PRIVATE_KEY: ""
          IMAGEKIT_URL_ENDPOINT: ""
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: ""
          LOG_LEVEL: "silent"
        run: npm run test:all

      - name: Jest unit tests (frontend & admin)
        # Separate Jest suites for frontend/admin components that use babel-jest.
        env:
          NODE_ENV: test
          APP_ENV: ci
        run: |
          npm run test:jest:frontend
          npm run test:jest:admin

  # ─────────────────────────────────────────────────────────────────────────────
  # SECURITY — fail the run if a credential is committed in the working tree
  # Scans the checked-out files only (not history): the goal is to stop a new
  # secret from entering the repository. .gitleaks.toml documents the known
  # false positives (placeholder templates, lockfile hashes, an embedded font).
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pinned SHA-256 from the v8.24.3 release checksums; bump both together.
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum --check --strict
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz

      - name: Scan for secrets
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E — Playwright end-to-end, accessibility, performance, load
  # Runs in parallel with quality. Boots full stack via webServer on offset ports
  # against an in-memory MongoDB with ImageKit disabled.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E · Performance · Load
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      - name: Install Playwright browser
        # The e2e job runs all four projects (chromium/mobile-chromium plus
        # webkit/mobile-webkit for Safari/iOS coverage), so both engines must be
        # present. --with-deps installs OS libraries; works on Linux runners.
        run: npx playwright install --with-deps chromium webkit firefox

      # E2E tests — main suite (excludes visual, performance, smoke)
      # Native Playwright timeout handles hanging runners on Linux.
      - name: E2E tests
        env:
          NODE_ENV: test
          APP_ENV: ci
          MONGODB_URI: mongodb://127.0.0.1:27017/careerveda_e2e
          MONGODB_DB_NAME: careerveda_e2e
          JWT_ACCESS_SECRET: e2e-access-secret-not-used-anywhere-else-0123456789
          JWT_REFRESH_SECRET: e2e-refresh-secret-not-used-anywhere-else-0123456789
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: ""
          LOG_LEVEL: "warn"
          IMAGEKIT_PUBLIC_KEY: ""
          IMAGEKIT_PRIVATE_KEY: ""
          IMAGEKIT_URL_ENDPOINT: ""
          E2E_API_PORT: "8081"
          E2E_FRONTEND_PORT: "5273"
          E2E_ADMIN_PORT: "5274"
        run: npx playwright test --grep-invert "@visual|@performance|@smoke"

      # Accessibility (axe-core WCAG 2.1 A/AA on key pages)
      - name: Accessibility tests
        env:
          NODE_ENV: test
          APP_ENV: ci
          MONGODB_URI: mongodb://127.0.0.1:27017/careerveda_e2e
          MONGODB_DB_NAME: careerveda_e2e
          JWT_ACCESS_SECRET: e2e-access-secret-not-used-anywhere-else-0123456789
          JWT_REFRESH_SECRET: e2e-refresh-secret-not-used-anywhere-else-0123456789
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: ""
          LOG_LEVEL: "warn"
          IMAGEKIT_PUBLIC_KEY: ""
          IMAGEKIT_PRIVATE_KEY: ""
          IMAGEKIT_URL_ENDPOINT: ""
          E2E_API_PORT: "8081"
          E2E_FRONTEND_PORT: "5273"
          E2E_ADMIN_PORT: "5274"
        run: npx playwright test e2e/accessibility.spec.js --grep-invert "@visual"

      # Performance budgets (Core Web Vitals on key pages)
      - name: Performance budgets
        env:
          NODE_ENV: test
          APP_ENV: ci
          MONGODB_URI: mongodb://127.0.0.1:27017/careerveda_e2e
          MONGODB_DB_NAME: careerveda_e2e
          JWT_ACCESS_SECRET: e2e-access-secret-not-used-anywhere-else-0123456789
          JWT_REFRESH_SECRET: e2e-refresh-secret-not-used-anywhere-else-0123456789
          COOKIE_SECURE: "false"
          COOKIE_DOMAIN: ""
          LOG_LEVEL: "warn"
          IMAGEKIT_PUBLIC_KEY: ""
          IMAGEKIT_PRIVATE_KEY: ""
          IMAGEKIT_URL_ENDPOINT: ""
          E2E_API_PORT: "8081"
          E2E_FRONTEND_PORT: "5273"
          E2E_ADMIN_PORT: "5274"
        run: npx playwright test --grep @performance --project=chromium --timeout=480000

      # Load test (hammers throwaway E2E API, asserts p95/error-rate)
      - name: Load test
        env:
          E2E_API_PORT: "8081"
          LOAD_SECONDS: "20"
          LOAD_CONCURRENCY: "25"
          LOAD_P95_BUDGET_MS: "500"
          LOAD_MAX_ERROR_RATE: "0.02"
        run: npm run test:load

      # Upload failure artifacts (screenshots, traces, videos)
      - name: Upload failure artifacts
        if: always()
        # Diagnostics only. GitHub account storage quota can be exhausted by
        # older runs; that must not turn a green test job red.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD — Production builds for all three apps
  # Only runs after quality AND e2e pass.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: [quality, e2e, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix admin

      - name: Install Playwright browser
        # Needed for postbuild (prerender.mjs + snapshot.mjs)
        run: npx playwright install --with-deps chromium

      - name: Build frontend, admin and backend
        env:
          VITE_PUBLIC_API_BASE_URL: ""
          VITE_ADMIN_API_BASE_URL: ""
          VITE_PUBLIC_SITE_URL: ""
        run: |
          npm run build          # runs prebuild + vite build + postbuild (prerender + snapshot)
          npm run build:admin
          npm run build:backend  # syntax check only (node --check)

      - name: Upload build artifacts
        # Convenience download only: deploy builds on the VM from git, and the
        # publish job needs no files from this job. When the account's artifact
        # storage quota is full, upload fails — do not fail the release for it.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: |
            dist/
            admin/dist/
          if-no-files-found: error
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # PUBLISH — Promote tested dev commit to main
  # Only runs for push to dev that passed all jobs above.
  # Non-force push: if main has moved on, the push fails and gets looked at.
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish dev → main
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Promote tested dev commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:refs/heads/main

  # ─────────────────────────────────────────────────────────────────────────────
  # DEPLOY — put the promoted main commit live on the Compute Engine VM
  # Needs: publish, so a commit is deployed only after it reached main through
  # the tested promotion. Opt-in: set repository variable CD_SSH_HOST, optional
  # CD_SSH_USER, and secret CD_SSH_KEY. Without them this job is skipped and the
  # VM's 2-minute autodeploy timer pulls the same tested main commit.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Compute Engine
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.CD_SSH_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.CD_SSH_HOST }}
          username: ${{ vars.CD_SSH_USER || 'deploy' }}
          key: ${{ secrets.CD_SSH_KEY }}
          script: sudo bash /opt/careerveda/deploy/deploy.sh

      - name: Wait for the live API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "http://${{ vars.CD_SSH_HOST }}/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "Site did not answer /health after deploy" >&2
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # SMOKE — Live-site sanity check after publish
  # Opt-in: set repository variables SMOKE_BASE_URL (plus optional
  # SMOKE_ADMIN_URL / SMOKE_API_URL) under Settings → Secrets and
  # variables → Actions → Variables. Without SMOKE_BASE_URL the job is skipped.
  # ─────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Live smoke
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.SMOKE_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_ADMIN_URL: ${{ vars.SMOKE_ADMIN_URL }}
      SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke the live site
        run: npm run test:smoke
