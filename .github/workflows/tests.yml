# CI on every push and PR, CD on green main:
#   tests  -> Vitest (frontend + admin + backend/Supertest)
#   e2e    -> Playwright across the full stack (in-memory DB, seeded per run)
#   deploy -> builds and ships the three Cloud Run services (main only)
#
# One file rather than a separate deploy workflow so `needs:` is the gate: a red
# test run simply never reaches the deploy job. A `workflow_run` trigger in a
# second file would deploy from the default branch's copy of the workflow and
# needs its own SHA plumbing to stay honest.
name: CI / CD

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege, declared explicitly. Without this block the job token gets
# whatever the repository default is — historically read/write on every scope,
# which is why Scorecard reports a missing declaration as a finding rather than
# a style note: this workflow runs `npm ci` on pull requests, so a malicious
# postinstall in a dependency would inherit a token that can push commits and
# move tags.
#
# `contents: read` is all three jobs need. checkout reads the repo; the deploy
# job authenticates to GCP with its own credentials, not this token; and
# upload-artifact@v4 uses the Actions runtime token rather than this one.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Repeated per job as well as at the workflow level. The workflow-level block
    # is the floor; CodeQL's missing-workflow-permissions query reads each job on
    # its own, and more usefully, a job that spells out its own grant cannot
    # silently widen later when someone raises the workflow default for one job
    # that needs more.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Three independent installs — admin no longer depends on the root
      # package, so the order here is arbitrary.
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix admin
      # Lint gates the deploy alongside the tests: it is green, it takes seconds,
      # and the rules it enforces (hook dependencies, unused bindings, promise
      # executor returns) are the kind of thing that ships silently otherwise.
      # Warnings do not fail it — see eslint.config.js for which two rules are
      # warnings and why.
      - run: npm run lint
      - run: npm run test:all

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix admin
      - run: npx playwright install --with-deps chromium
      # Everything except @visual. Screenshot baselines are named after the
      # platform that recorded them, so they are a property of one machine, not
      # of the code — a correct page fails here purely because the baseline was
      # taken on a different OS. That is not a reason to block a deploy, so the
      # visual suite runs in the Quality workflow instead, on Linux, advisory.
      - run: npx playwright test --grep-invert @visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build + push + deploy. Everything it does lives in scripts/deploy-cloudrun.sh
  # already, which is also what you run by hand — so CD and a manual deploy can
  # never drift apart. This job only supplies credentials and the env it reads.
  deploy:
    needs: [tests, e2e]
    # PRs and feature branches build and test, but only main ships — and only
    # once GCP is actually configured. Without the opt-in variable this job
    # would red-X every push to main at the auth step, on a repo where nothing
    # is wrong with the code, which is the fastest way to teach a team to stop
    # reading the build status. Set the repository variable DEPLOY_ENABLED to
    # "true" after the secrets below exist. (A secret cannot be tested here:
    # the `secrets` context is not available in a job-level `if`.)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Still read-only. The GCP credential is a repository secret consumed by
    # google-github-actions/auth, so nothing here needs a wider GitHub token —
    # the job that ships to production is the last one that should have one.
    # Switching to Workload Identity Federation later means adding
    # `id-token: write` here, and nothing else.
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          # ponytail: service-account JSON key in a repo secret. Upgrade to
          # Workload Identity Federation (workload_identity_provider +
          # service_account) when you want keyless auth with no key to rotate.
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          # The script's final domain-mapping step is `gcloud beta`, which would
          # otherwise try to install the component interactively and hang.
          install_components: beta
      # The script pushes to Artifact Registry, so docker needs gcloud as its
      # credential helper for that registry host.
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
        env:
          GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}

      - name: Deploy backend, frontend and admin to Cloud Run
        # `bash <script>`, not `./<script>`: the file is committed 100644 (it was
        # authored on Windows, which has no exec bit to record), so invoking it
        # directly would be "Permission denied" on the runner.
        run: bash ./scripts/deploy-cloudrun.sh
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
          DOMAIN: ${{ secrets.DOMAIN }}
          # Runtime secrets for the backend service.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
