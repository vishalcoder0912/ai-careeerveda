# CD — manual redeploy of the Compute Engine VM.
#
# Normal deployment is automatic and gated:
#   push to dev → CI/CD (security, quality, e2e, build) → publish dev→main
#   → the CI/CD `deploy` job (if CD_SSH_HOST is set) or the VM's 2-minute
#     careerveda-autodeploy.timer pulls the tested main commit.
#
# This workflow is only for an on-demand rebuild/restart of the commit that is
# already on main — for example after editing /etc/careerveda/build.env. It
# deliberately has no push trigger, so a direct push to main cannot deploy
# code that CI has not seen.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   Variables:  CD_SSH_HOST   VM external IP (or DNS name)
#               CD_SSH_USER   SSH user on the VM (e.g. deploy)
#   Secret:     CD_SSH_KEY    private key whose public half is in that user's
#                             authorized_keys (generate: ssh-keygen -t ed25519)
#
# One-time VM provisioning lives in deploy/setup-server.sh — see DEPLOYMENT.md.

name: CD (Compute Engine)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the VM is already on the newest main commit
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cd-compute-engine
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main on VM
    if: vars.CD_SSH_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.CD_SSH_HOST }}
          username: ${{ vars.CD_SSH_USER || 'deploy' }}
          key: ${{ secrets.CD_SSH_KEY }}
          script: |
            if [ "${{ inputs.force }}" = "true" ]; then
              sudo FORCE=1 bash /opt/careerveda/deploy/deploy.sh
            else
              sudo bash /opt/careerveda/deploy/deploy.sh
            fi

      - name: Wait for the live API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "http://${{ vars.CD_SSH_HOST }}/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "Site did not answer /health after deploy" >&2
          exit 1
