# Dynamic API security testing (DAST) via APIsec.
#
# Unlike every other scan in this repository, this one does not read the code. It
# drives a *running* API from its OpenAPI spec and sends real traffic to it —
# including writes. Two consequences that shape everything below:
#
#   1. The target must not be production. A scan that exercises the admin routes
#      against the real Atlas cluster will create and delete real records. Point
#      the APIsec project at a staging deployment, or at the throwaway stack in
#      compose.yaml. The target is configured in APIsec, not here.
#   2. It cannot run on every push and pull request. The starter template this
#      file came from does exactly that, which means every PR triggers a full
#      active scan of whatever that target is. Weekly plus on-demand is the
#      cadence that matches what the scan costs.
#
# Credentials are an APIsec *username and password*, not a token. The action has
# no PAT or bearer input — a personal access token works against APIsec's own
# REST API but not against this action, so do not try to substitute one.
#
# Setup, once:
#   1. Register the API as a project at https://cloud.apisec.ai
#      (Project -> Configurations -> Integrations -> CI-CD -> GitHub Actions).
#   2. Create an APIsec user with ROLE_USER for CI to run as.
#   3. Settings -> Secrets and variables -> Actions:
#        secret   apisec_username   that user's username
#        secret   apisec_password   that user's password
#        variable APISEC_PROJECT    the project name exactly as APIsec shows it
#        variable APISEC_ENABLED    true
#
# Until APISEC_ENABLED is true the job skips. That is deliberate and matches the
# deploy job in tests.yml: before the secrets exist this job can only fail at the
# login step, and a main branch that is permanently red for a reason unrelated to
# the code teaches everyone to stop reading the build status.

name: APIsec

on:
  # Weekly, not per-push. See the note above — this scan writes to a live target.
  schedule:
    - cron: "44 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_APIsec_scan:
    if: ${{ vars.APISEC_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read # upload-sarif needs the run status on a private repository
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The action's own failure mode is unreadable: a missing credential shows up
      # as an 11-second login followed by `generated token is: null`, which does
      # not say which of the three settings is absent — or that one of them was
      # put on the wrong tab. Secrets and variables share one settings page, so
      # adding APISEC_PROJECT as a *secret* is the easy mistake, and it leaves
      # vars.APISEC_PROJECT empty with no indication why.
      - name: Check the APIsec settings are present
        env:
          USERNAME: ${{ secrets.apisec_username }}
          PASSWORD: ${{ secrets.apisec_password }}
          PROJECT: ${{ vars.APISEC_PROJECT }}
        run: |
          missing=""
          [ -n "$USERNAME" ] || missing="$missing secrets.apisec_username"
          [ -n "$PASSWORD" ] || missing="$missing secrets.apisec_password"
          [ -n "$PROJECT" ]  || missing="$missing vars.APISEC_PROJECT"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing"
            echo "Settings -> Secrets and variables -> Actions."
            echo "The two credentials belong on the Secrets tab; APISEC_PROJECT belongs on the Variables tab."
            exit 1
          fi
          # Safe to print: a project name is not a credential, and seeing it is
          # what catches the scan pointing at someone else's project.
          echo "Settings present. Scanning APIsec project: $PROJECT"

      - name: APIsec scan
        uses: apisec-inc/apisec-run-scan@025432089674a28ba8fb55f8ab06c10215e772ea # v1.0.6
        with:
          # Never inline the real values here. This file is committed to a public
          # repository, so a literal password is published the moment it is
          # pushed, permanently — rewriting history does not unpublish it. It also
          # does not work: ${{ }} is an expression context, and a bare email or
          # password is not a valid expression, so the workflow fails to parse
          # before it ever reaches APIsec.
          apisec-username: ${{ secrets.apisec_username }}
          apisec-password: ${{ secrets.apisec_password }}
          # The project name as it appears in APIsec. The starter template ships
          # "VAmPI" hardcoded — that is APIsec's own deliberately-vulnerable demo
          # API. Left in place it scans their sample app and reports its findings
          # as though they were this repository's.
          apisec-project: ${{ vars.APISEC_PROJECT }}
          sarif-result-file: "apisec-results.sarif"

      # Same guard the sast job in quality.yml uses, for the same reason: code
      # scanning ingests SARIF only on public repositories, or on private ones
      # with Advanced Security. Without it the upload is rejected and the job goes
      # red over a scan that ran perfectly well. The artifact below is the copy
      # you can always read.
      - name: Import results
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        with:
          sarif_file: ./apisec-results.sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: apisec-sarif
          path: ./apisec-results.sarif
          retention-days: 14
          if-no-files-found: warn
